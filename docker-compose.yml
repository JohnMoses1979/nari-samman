services:
  mysql:
    image: mysql:8.0
    container_name: nari-samman-mysql
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nari-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nari-samman-backend
    container_name: nari-samman-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_ENABLED: ${ADMIN_ENABLED}
      ADMIN_ALLOW_DEFAULT_CREDENTIALS: ${ADMIN_ALLOW_DEFAULT_CREDENTIALS}
      APP_BASE_URL: http://13.207.19.48:8080
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
      GROQ_API_KEY: ${GROQ_API_KEY}
    expose:
      - "8080"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nari-net

  frontend:
    build:
      context: ./nari-samman
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: http://13.207.19.48:8080
        EXPO_PUBLIC_API_BASE_URL: http://13.207.19.48:8080
        APP_BASE_URL: http://13.207.19.48:8080
    image: nari-samman-frontend
    container_name: nari-samman-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - nari-net

volumes:
  mysql_data:
  backend_uploads:

networks:
  nari-net:
    driver: bridge
