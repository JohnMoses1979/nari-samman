spring.application.name=nari

# Listen on all interfaces so phones on the same Wi‑Fi can reach the backend
server.address=0.0.0.0
server.port=8080

# ===============================
# MySQL Database Connection
# ===============================
spring.datasource.url=jdbc:mysql://mysql:3306/nari_samman_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
